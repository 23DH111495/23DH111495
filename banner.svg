  <text x="34" y="168" font-family="Consolas, monospace" font-size="9" fill="#8a3030">DARKNOVEL_API</text>
  <text x="225" y="168" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#5c2020">3/3</text>

  <!-- center: name as the "item" -->
  <text x="280" y="66" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#c94040">ENGINEERING</text>

  <text x="503" y="120" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="42" font-weight="700" fill="#4a0808">NGO THIEU KHANG</text>
  <text x="500" y="117" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="42" font-weight="700" fill="#ff3b3b" filter="url(#glow)">NGO THIEU KHANG</text>

  <text x="500" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="13" letter-spacing="3" fill="#b83030">SOFTWARE ENGINEER — LEVEL 3RD YEAR</text>

  <!-- wireframe schematic lines, like the weapon render -->
  <g stroke="#7a2424" stroke-width="1" fill="none" opacity="0.7">
    <path d="M370,175 L410,165 L630,165 L660,178 L630,190 L410,190 Z"/>
    <line x1="440" y1="165" x2="440" y2="190"/>
    <line x1="480" y1="165" x2="480" y2="190"/>
    <line x1="520" y1="165" x2="520" y2="190"/>
    <line x1="560" y1="165" x2="560" y2="190"/>
    <line x1="600" y1="165" x2="600" y2="190"/>
  </g>

  <!-- materials/status boxes bottom -->
  <rect x="740" y="46" width="240" height="176" fill="none" stroke="#4a1414" stroke-width="1"/>
  <text x="750" y="62" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#c94040">TOOLTIP</text>
