  <text x="225" y="116" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#5c2020">3/3</text>

  <rect x="26" y="128" width="208" height="22" fill="none" stroke="#3a1010" stroke-width="1"/>
  <text x="34" y="142" font-family="Consolas, monospace" font-size="9" fill="#8a3030">FLUTTER_MOBILE</text>
  <text x="225" y="142" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#5c2020">3/3</text>

