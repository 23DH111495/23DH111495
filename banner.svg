  <text x="750" y="140" font-family="Consolas, monospace" font-size="9" fill="#6b2424">DARKNOVEL ECOSYSTEM</text>
  <text x="750" y="154" font-family="Consolas, monospace" font-size="9" fill="#6b2424">WEB · API · MOBILE</text>
  <rect x="750" y="196" width="210" height="18" fill="#5c1010"/>
  <text x="855" y="209" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="1" fill="#ffb3b3">FIND ON GITHUB</text>

  <!-- corner ticks -->
  <path d="M20,40 L20,46" stroke="#8c1616" stroke-width="2"/>
  <path d="M980,40 L980,46" stroke="#8c1616" stroke-width="2"/>

