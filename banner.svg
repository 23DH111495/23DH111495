  <text x="90" y="19" font-family="Consolas, monospace" font-size="10" letter-spacing="1" fill="#6b2020">CRED 15,004,251</text>
  <text x="500" y="19" text-anchor="middle" font-family="Consolas, monospace" font-size="10" letter-spacing="4" fill="#8a2a2a">PROFILE // TOOLTIP</text>
  <text x="980" y="19" text-anchor="end" font-family="Consolas, monospace" font-size="10" letter-spacing="1" fill="#6b2020">DATA LINK ACTIVE</text>

  <!-- left panel: skill list style -->
