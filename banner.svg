  <text x="225" y="89" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#1a0505">LVL 3</text>

  <rect x="26" y="102" width="208" height="22" fill="none" stroke="#3a1010" stroke-width="1"/>
